[build]
  command   = "bun run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  # These are intentionally public: a Privy client app ID, an onchain contract
  # address, and a domain-restricted Alchemy RPC key meant for browser use.
  # None of them grant access to private keys, funds, or backend systems.
  SECRETS_SCAN_OMIT_KEYS = "VITE_PRIVY_APP_ID,VITE_SCRATCH_CONTRACT,VITE_SCRATCH_CONTRACT_V3,VITE_ALCHEMY_API_KEY"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
